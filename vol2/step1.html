<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>よんで わかる！ 第2巻 STEP 1</title><style>

const chars=[`<svg class="char" viewBox="0 0 150 130"><g fill="#65bf55" stroke="#2c6c35" stroke-width="4"><ellipse cx="75" cy="78" rx="48" ry="38"/><circle cx="60" cy="48" r="24"/><circle cx="93" cy="48" r="24"/><path d="M44 30l-7-20 17 13M106 30l8-20-18 13"/></g><circle cx="57" cy="47" r="4"/><circle cx="96" cy="47" r="4"/><path d="M55 70q20 18 40 0" fill="none" stroke="#244" stroke-width="4"/></svg>`,`<svg class="char" viewBox="0 0 150 130"><rect x="38" y="35" width="74" height="68" rx="20" fill="#60bde8" stroke="#245f81" stroke-width="4"/><circle cx="60" cy="64" r="8" fill="#173a55"/><circle cx="90" cy="64" r="8" fill="#173a55"/><path d="M58 84h34" stroke="#173a55" stroke-width="5"/><path d="M75 35V18M67 18h16" stroke="#245f81" stroke-width="5"/><rect x="24" y="55" width="16" height="38" rx="8" fill="#60bde8"/><rect x="110" y="55" width="16" height="38" rx="8" fill="#60bde8"/></svg>`,`<svg class="char" viewBox="0 0 150 130"><circle cx="75" cy="56" r="32" fill="#ffd1a8"/><path d="M43 46q8-35 32-34q28 0 36 34q-18-15-34-9q-18 5-34 9" fill="#262626"/><circle cx="62" cy="58" r="4"/><circle cx="88" cy="58" r="4"/><path d="M58 73q17 12 34 0" fill="none" stroke="#923c34" stroke-width="4"/><rect x="48" y="87" width="54" height="32" rx="10" fill="#ffcc42"/></svg>`,`<svg class="char" viewBox="0 0 150 130"><g fill="#a56be0" stroke="#65449b" stroke-width="4"><ellipse cx="76" cy="75" rx="45" ry="40"/><circle cx="76" cy="45" r="30"/><path d="M48 34l-8-25 22 18M104 34l8-25-22 18"/></g><circle cx="63" cy="45" r="5" fill="#fff"/><circle cx="89" cy="45" r="5" fill="#fff"/><path d="M58 65q18 15 36 0" fill="none" stroke="#fff" stroke-width="4"/></svg>`,`<svg class="char" viewBox="0 0 150 130"><path d="M28 94q15-60 47-65q38 1 49 65z" fill="#f28c35" stroke="#a9561e" stroke-width="4"/><circle cx="60" cy="63" r="7"/><circle cx="90" cy="63" r="7"/><path d="M58 82q17 12 34 0" fill="none" stroke="#6f3718" stroke-width="4"/></svg>`];
const items=[{word:"ねこ",say:"ねこ",art:"cat"},{word:"いぬ",say:"いぬ",art:"dog"},{word:"りんご",say:"りんご",art:"apple"},{word:"おひさま",say:"おひさま",art:"sun"},{word:"おむすび",say:"おむすび",art:"rice"},{word:"えんぴつ",say:"えんぴつ",art:"pencil"},{word:"ほん",say:"ほん",art:"book"},{word:"はな",say:"はな",art:"flower"},{word:"くるま",say:"くるま",art:"car"},{word:"かさ",say:"かさ",art:"umbrella"}];let idx=0,answered=false;const $=id=>document.getElementById(id);function key(){const d=new Date();return`ywv2_${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}const TK=key(),AK="ywv2_all";function val(k){return Number(localStorage.getItem(k)||0)}function refresh(){todayPts.textContent=val(TK);totalPts.textContent=val(AK)}function add(){localStorage.setItem(TK,val(TK)+10);localStorage.setItem(AK,val(AK)+10);refresh()}function speak(t,r=.9){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=r;speechSynthesis.speak(u)}function opts(correct){let a=Object.keys(art).filter(x=>x!==correct).sort(()=>Math.random()-.5).slice(0,2);return[correct,...a].sort(()=>Math.random()-.5)}function render(){answered=false;const x=items[idx];num.textContent=idx+1;target.textContent=x.word;choices.innerHTML="";opts(x.art).forEach(k=>{const b=document.createElement("button");b.className="choice";b.innerHTML=art[k];b.onclick=()=>check(k,b);choices.appendChild(b)});feedback.className="feedback";feedback.textContent="ことばを よんで、あう えを えらぼう！";next.disabled=true;next.textContent=idx===9?"さいごまで できた！ ▶":"つぎへ ▶"}function check(k,b){if(answered)return;const x=items[idx];if(k===x.art){answered=true;b.classList.add("correct");add();character.innerHTML=chars[Math.floor(Math.random()*chars.length)];const z=document.createElement("div");z.className="bonus";z.textContent="+10 pt!";charzone.appendChild(z);setTimeout(()=>z.remove(),1200);feedback.className="feedback ok";feedback.textContent=`🎉 せいかい！ 「${x.word}」だね。10ポイント ゲット！`;speak("せいかい！ じゅっポイント ゲット！");next.disabled=false}else{b.classList.add("wrong");feedback.className="feedback ng";feedback.textContent="おしい！ もういちど えを みてみよう。";speak("おしい！ もういちど。",.9);setTimeout(()=>b.classList.remove("wrong"),700)}}listen.onclick=()=>speak(items[idx].say,.9);slow.onclick=()=>speak(items[idx].say,.65);target.onclick=()=>speak(items[idx].say,.82);next.onclick=()=>{if(idx<9){idx++;render()}else{idx=0;render();feedback.className="feedback ok";feedback.textContent="🎊 10もん おしまい！ もういちど やると、また ポイントが もらえるよ！";speak("じゅうもん おしまい！ もういちど やってみよう！")}};refresh();render();
</script></body></html>
