<!doctype html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#79d2ff">
<title>よんで わかる！ 第2巻 STEP 5</title><style>
:root{--sky:#79d2ff;--deep:#164f89;--ink:#243243;--green:#67c56d;--red:#ef5350;--purple:#8e66d9;--orange:#ff9f43}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;background:linear-gradient(#79d2ff,#dff7ff 45%,#fff8d8 100%);color:var(--ink);min-height:100vh}
.app{max-width:1080px;margin:auto;padding:14px}
header{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.logo{background:white;border:4px solid var(--deep);border-radius:24px;padding:12px 18px;box-shadow:0 7px 0 rgba(22,79,137,.16)}
.logo h1{margin:0;font-size:clamp(28px,4vw,46px);font-weight:900}
.logo .sub{font-weight:900;color:#456}
.points{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:300px}
.pointbox{background:white;border:3px solid #d6edf7;border-radius:18px;padding:8px 12px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.pointbox .label{font-size:14px;font-weight:800;color:#577}
.pointbox .num{font-size:30px;font-weight:900;color:#e06b00}
.nav{margin:12px 0}
.nav a{display:inline-block;text-decoration:none;font-weight:900;border-radius:14px;padding:8px 12px;margin-right:6px}
.menu{background:white;color:#164f89;border:2px solid #b9dfea}.prev{background:#eef4f7;color:#456;border:2px solid #cbdde6}.nextnav{background:#8e66d9;color:#fff}
.main{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}
.panel{background:rgba(255,255,255,.97);border:4px solid #dff0f8;border-radius:26px;padding:18px;box-shadow:0 10px 24px rgba(35,94,130,.14)}
.stage{display:inline-block;background:#9b5a2b;color:white;padding:7px 15px;border-radius:12px;font-size:21px;font-weight:900;box-shadow:inset 0 -4px rgba(0,0,0,.12)}
.progress{margin:12px 0;font-weight:900;color:#456}
.card{background:#fafdff;border:4px dashed #8ed2ee;border-radius:22px;padding:18px}
.text{font-size:clamp(25px,3.7vw,40px);font-weight:900;line-height:1.8}
.chunk{display:inline-block;background:#fffbe7;border:2px solid #f1d76b;border-radius:12px;padding:2px 7px;margin:2px;cursor:pointer}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
button{font:inherit;border:0;border-radius:16px;padding:11px 15px;font-weight:900;cursor:pointer}
.listen{background:#1675c3;color:#fff;box-shadow:0 5px 0 #0d4e84}.slow{background:#eef6fa;border:2px solid #cfe0e8}
.help{margin-top:12px;background:#fff3f6;border:3px solid #f4bfd0;border-radius:18px;padding:11px;font-weight:800}
.qtitle{background:#e84545;color:white;text-align:center;border-radius:16px;padding:9px;font-size:24px;font-weight:900;box-shadow:0 5px 0 #b72e2e}
.question{font-size:clamp(23px,3vw,32px);font-weight:900;background:#fff9db;border:3px dashed #f1ca58;border-radius:18px;padding:12px;margin:13px 0}
.answers{display:grid;gap:10px}
.answer{background:white;border:3px solid #e2e6ea;border-radius:18px;min-height:70px;padding:10px 14px;font-size:clamp(21px,2.8vw,29px);text-align:left}
.answer.correct{border-color:#62c56f;background:#effbea}.answer.wrong{border-color:#ef7777;background:#fff1f1}
.feedback{min-height:80px;margin-top:12px;border-radius:18px;background:#f5f8fb;padding:12px 14px;font-size:19px;font-weight:900}
.feedback.ok{background:#edfae9;color:#2a7636}.feedback.ng{background:#fff0f0;color:#a33333}
.next{width:100%;margin-top:12px;background:#8e66d9;color:#fff;font-size:21px;box-shadow:0 5px 0 #6545a5}
.charZone{margin-top:13px;min-height:145px;border-radius:22px;background:linear-gradient(#dff7ff,#fff8ce);border:3px solid #bfe4f3;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.charZone .msg{position:absolute;left:12px;top:10px;background:#fff;border-radius:14px;padding:8px 12px;font-weight:900}
.char{width:150px;height:125px;animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.2) rotate(-10deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.bonus{position:absolute;right:15px;bottom:8px;font-size:28px;font-weight:900;color:#e06b00;animation:float 1.2s ease forwards}
@keyframes float{0%{transform:translateY(20px);opacity:0}40%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.adultWrap{text-align:right;margin-top:8px}.adultBtn{background:#eef4f7;color:#4a5d69;border:2px solid #c9d8df;border-radius:14px;padding:7px 11px;font-size:13px}
.adultPanel{display:none;margin-top:8px;background:white;border:2px solid #d5e1e6;border-radius:14px;padding:10px;text-align:left}.resetBtn{width:100%;background:#fff0f0;color:#a93535;border:2px solid #e6aaaa}
@media(max-width:820px){header{grid-template-columns:1fr}.points{min-width:0}.main{grid-template-columns:1fr}}
</style>
<style>
.craneWrap{margin-top:12px;background:#fff6cc;border:4px solid #f0c348;border-radius:22px;padding:12px;text-align:center}
.machine{position:relative;height:230px;background:linear-gradient(#c5efff,#eefbff);border:6px solid #4a78a8;border-radius:18px;overflow:hidden}
.rail{position:absolute;top:18px;left:20px;right:20px;height:10px;background:#607d8b;border-radius:10px}
.claw{position:absolute;top:22px;left:46%;width:40px;height:95px;transition:1s ease}
.claw:before{content:"";position:absolute;left:18px;top:0;width:5px;height:55px;background:#555}
.claw:after{content:"🪝";position:absolute;left:2px;top:44px;font-size:38px}
.prize{position:absolute;bottom:15px;font-size:55px;transition:1s ease}
.p1{left:15%}.p2{left:40%}.p3{left:68%}
.machine.grab .claw{top:110px}.machine.win .claw{top:35px;left:68%}
.prize.got{transform:translateY(-95px) translateX(40px);opacity:.3}
.craneMsg{font-size:20px;font-weight:900;margin-top:8px;color:#8a5b00}
</style>
</head>
<body><div class="app">
<header>
<div class="logo"><h1>📘 よんで わかる！ 第2巻</h1><div class="sub">STEP 5　みじかい おはなしで クレーンゲーム</div></div>
<div><div class="points">
<div class="pointbox"><div class="label">きょう ゲット</div><div class="num"><span id="todayPts">0</span> pt</div></div>
<div class="pointbox"><div class="label">るいせき</div><div class="num"><span id="totalPts">0</span> pt</div></div>
</div><div class="adultWrap"><button id="adultBtn" class="adultBtn">⚙️ おとな用（3びょう ながおし）</button>
<div id="adultPanel" class="adultPanel"><button id="resetPts" class="resetBtn">ポイントを 0 に もどす</button></div></div></div>
</header>
<div class="nav"><a class="menu" href="index.html">🏠 第2巻メニュー</a><a class="prev" href="step4.html">◀ STEP 4</a></div>
<div class="main"><section class="panel"><div class="stage">🏆 よんで クレーンゲーム！</div><div class="progress">もんだい <span id="num">1</span> / 10</div>
<div class="card"><div id="text" class="text"></div><div class="controls"><button id="readAll" class="listen">🔊 ぜんぶ きく</button><button id="slow" class="slow">🐢 ゆっくり きく</button></div>
<div class="help">💡 みじかい おはなしを よんで、いみを つかもう。せいかいすると クレーンが うごくよ！</div></div>
<div class="craneWrap"><div id="machine" class="machine"><div class="rail"></div><div class="claw"></div><div class="prize p1">🦖</div><div class="prize p2">🤖</div><div class="prize p3" id="targetPrize">👾</div></div><div id="craneMsg" class="craneMsg">せいかいして けいひんを ゲットしよう！</div></div>
<div id="charZone" class="charZone"><div class="msg">1もん 10ポイント！</div><div id="character"></div></div></section><section class="panel"><div class="qtitle">🎯 こたえを えらぼう！</div><div id="question" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback">おはなしを よんで こたえよう。</div><button id="next" class="next" disabled>つぎへ ▶</button></section></div>
</div><script>
const chars=[
`<svg class="char" viewBox="0 0 150 125"><g fill="#68c35b" stroke="#2e7338" stroke-width="4"><ellipse cx="75" cy="78" rx="45" ry="35"/><circle cx="58" cy="48" r="22"/><circle cx="92" cy="48" r="22"/><path d="M44 31l-7-18 16 10M106 31l7-18-16 10"/></g><circle cx="56" cy="48" r="4"/><circle cx="94" cy="48" r="4"/><path d="M57 68q18 16 36 0" fill="none" stroke="#244" stroke-width="4"/></svg>`,
`<svg class="char" viewBox="0 0 150 125"><rect x="40" y="34" width="70" height="65" rx="18" fill="#61bde8" stroke="#245f81" stroke-width="4"/><circle cx="61" cy="61" r="7" fill="#173a55"/><circle cx="89" cy="61" r="7" fill="#173a55"/><path d="M59 82h32" stroke="#173a55" stroke-width="5"/><path d="M75 34V18M67 18h16" stroke="#245f81" stroke-width="5"/></svg>`,
`<svg class="char" viewBox="0 0 150 125"><path d="M30 96q14-61 45-66q39 1 47 66z" fill="#f28c35" stroke="#a9561e" stroke-width="4"/><circle cx="60" cy="64" r="7"/><circle cx="90" cy="64" r="7"/><path d="M58 82q17 12 34 0" fill="none" stroke="#6f3718" stroke-width="4"/><path d="M43 35l8-24 14 18M107 35l-8-24-14 18" fill="#ffd65c"/></svg>`,
`<svg class="char" viewBox="0 0 150 125"><circle cx="75" cy="53" r="30" fill="#ffd1a8"/><path d="M45 45q7-32 30-33q27 0 34 33q-17-14-33-8q-17 5-31 8" fill="#262626"/><circle cx="62" cy="56" r="4"/><circle cx="88" cy="56" r="4"/><path d="M58 72q17 12 34 0" fill="none" stroke="#923c34" stroke-width="4"/><rect x="50" y="84" width="50" height="30" rx="10" fill="#ffcc42"/></svg>`
];

const $=id=>document.getElementById(id);
function dateKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
const TODAY_KEY="yomide_v2_today_"+dateKey(), TOTAL_KEY="yomide_v2_total";
const getPts=k=>Number(localStorage.getItem(k)||0);
function refreshPts(){$("todayPts").textContent=getPts(TODAY_KEY);$("totalPts").textContent=getPts(TOTAL_KEY);}
function addPts(n){localStorage.setItem(TODAY_KEY,getPts(TODAY_KEY)+n);localStorage.setItem(TOTAL_KEY,getPts(TOTAL_KEY)+n);refreshPts();}
function speak(t,rate=.9){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=rate;u.pitch=1;speechSynthesis.speak(u);}
function showChar(){ $("character").innerHTML=chars[Math.floor(Math.random()*chars.length)]; const d=document.createElement("div");d.className="bonus";d.textContent="+10 pt!";$("charZone").appendChild(d);setTimeout(()=>d.remove(),1200);}
let adultTimer=null;
$("adultBtn").addEventListener("pointerdown",()=>adultTimer=setTimeout(()=>{$("adultPanel").style.display=$("adultPanel").style.display==="block"?"none":"block";adultTimer=null},3000));
["pointerup","pointerleave","pointercancel"].forEach(ev=>$("adultBtn").addEventListener(ev,()=>{if(adultTimer){clearTimeout(adultTimer);adultTimer=null}}));
$("resetPts").onclick=()=>{if(confirm("きょうのポイント と るいせきポイントを 0 に もどします。よろしいですか？")){localStorage.setItem(TODAY_KEY,0);localStorage.setItem(TOTAL_KEY,0);refreshPts();$("adultPanel").style.display="none";}};

const items=[{"text": "こうえんに ねこが 3びき いました。あとから 2ひき きました。", "say": "こうえん に、ねこ が さんびき いました。あとから、にひき きました。", "q": "ねこは ぜんぶで なんびき？", "choices": ["4ひき", "5ひき", "6ひき"], "ans": 1}, {"text": "あさ、そらが くらくなって あめが ふりだしました。ゆうたくんは かさを ひらきました。", "say": "あさ、そら が くらくなって、あめ が ふりだしました。ゆうたくん わ、かさを ひらきました。", "q": "ゆうたくんは なぜ かさを ひらいた？", "choices": ["あめが ふったから", "ねむいから", "おなかが すいたから"], "ans": 0}, {"text": "みきちゃんは ほんを かりに としょかんへ いきました。えほんを 2さつ えらびました。", "say": "みきちゃん わ、ほんを かりに、としょかん え いきました。えほんを、にさつ えらびました。", "q": "みきちゃんは どこへ いった？", "choices": ["としょかん", "こうえん", "えき"], "ans": 0}, {"text": "いぬは たくさん はしりました。そのあと みずを ごくごく のみました。", "say": "いぬ わ、たくさん はしりました。そのあと、みずを ごくごく のみました。", "q": "いぬが みずを のんだのは なぜ？", "choices": ["のどが かわいたから", "さむかったから", "ほんを よみたいから"], "ans": 0}, {"text": "こうたくんは えんぴつを 2ほん もっています。おねえさんが 3ぼん くれました。", "say": "こうたくん わ、えんぴつを、にほん もっています。おねえさん が、さんぼん くれました。", "q": "えんぴつは ぜんぶで なんぼん？", "choices": ["4ほん", "5ほん", "6ほん"], "ans": 1}, {"text": "おひさまが しずみました。そらが だんだん くらくなりました。", "say": "おひさま が、しずみました。そら が、だんだん くらくなりました。", "q": "つぎは どうなりそう？", "choices": ["よるに なる", "あさに もどる", "うみが なくなる"], "ans": 0}, {"text": "うさぎは にんじんが だいすきです。きょうも にんじんを みつけて うれしそうです。", "say": "うさぎ わ、にんじん が だいすきです。きょうも、にんじんを みつけて、うれしそうです。", "q": "うさぎが うれしいのは なぜ？", "choices": ["すきな にんじんを みつけたから", "あめが ふったから", "でんしゃに のったから"], "ans": 0}, {"text": "さきちゃんは ながぐつを はいて そとへ でました。じめんには みずたまりが あります。", "say": "さきちゃん わ、ながぐつを はいて、そと え でました。じめん に わ、みずたまり が あります。", "q": "どんな てんきだったかも？", "choices": ["あめが ふったあと", "ずっと かわいていた", "ゆきだけ ふった"], "ans": 0}, {"text": "でんしゃが えきに つきました。おきゃくさんが おりて、べつの おきゃくさんが のりました。", "say": "でんしゃ が、えき に つきました。おきゃくさん が おりて、べつ の おきゃくさん が、のりました。", "q": "でんしゃが とまったのは どこ？", "choices": ["えき", "こうえん", "やま"], "ans": 0}, {"text": "クレーンが ぬいぐるみを つかみました。ゆっくり はこまで はこんで、おとしました。", "say": "クレーン が、ぬいぐるみを つかみました。ゆっくり、はこ まで はこんで、おとしました。", "q": "どうなった？", "choices": ["けいひんを ゲットした", "ぬいぐるみが そらへ とんだ", "でんしゃが きた"], "ans": 0}];
const prizes=["🦖","🤖","👾","🐲","🛸","🦈","🦁","🐯","🚀","🏎️"];
let idx=0,answered=false;
function render(){answered=false;const x=items[idx];$("num").textContent=idx+1;$("text").textContent=x.text;$("question").textContent=x.q;$("answers").innerHTML="";
[0,1,2].sort(()=>Math.random()-.5).forEach(i=>{const b=document.createElement("button");b.className="answer";b.textContent=x.choices[i];b.onclick=()=>check(i,b);$("answers").appendChild(b);});
$("feedback").className="feedback";$("feedback").textContent="おはなしを よんで こたえよう。";$("next").disabled=true;$("machine").className="machine";$("targetPrize").className="prize p3";$("targetPrize").textContent=prizes[idx];$("craneMsg").textContent="せいかいして けいひんを ゲットしよう！";}
function craneWin(){$("machine").classList.add("grab");setTimeout(()=>{$("machine").classList.remove("grab");$("machine").classList.add("win");$("targetPrize").classList.add("got");$("craneMsg").textContent="🎉 けいひん ゲット！";},700);}
function check(i,b){if(answered)return;const x=items[idx];if(i===x.ans){answered=true;b.classList.add("correct");addPts(10);showChar();craneWin();$("feedback").className="feedback ok";$("feedback").textContent="🎉 せいかい！ 10ポイント ＋ けいひん ゲット！";speak("せいかい！ じゅっポイント。けいひん ゲット！");$("next").disabled=false;}else{b.classList.add("wrong");$("feedback").className="feedback ng";$("feedback").textContent="おしい！ おはなしを もういちど みてみよう。";speak("おしい！ もういちど");setTimeout(()=>b.classList.remove("wrong"),700);}}
$("readAll").onclick=()=>speak(items[idx].say,.9);$("slow").onclick=()=>speak(items[idx].say,.65);
$("next").onclick=()=>{if(idx<9){idx++;render();}else{idx=0;render();$("feedback").className="feedback ok";$("feedback").textContent="🏆 STEP 5 クリア！ また けいひんを とりに こよう！";speak("ステップファイブ クリア！ また けいひんを とりに こよう！");}};
refreshPts();render();
</script></body></html>
