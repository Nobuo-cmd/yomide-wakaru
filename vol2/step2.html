<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#79d2ff">
<title>よんで わかる！ 第2巻 STEP 2</title>
<style>
:root{
 --sky:#7fd8ff;--deep:#164f89;--ink:#243243;--green:#67c56d;--red:#ef5350;--purple:#8e66d9;--orange:#ff9f43;
}
*{box-sizing:border-box}
body{
 margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
 background:linear-gradient(#79d2ff,#dff7ff 45%,#fff8d8 100%);color:var(--ink);min-height:100vh
}
.app{max-width:1080px;margin:auto;padding:14px}
header{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.logo{background:white;border:4px solid var(--deep);border-radius:24px;padding:12px 18px;box-shadow:0 7px 0 rgba(22,79,137,.16)}
.logo h1{margin:0;font-size:clamp(28px,4vw,46px);font-weight:900}
.logo .sub{font-weight:900;color:#456}
.points{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-width:300px}
.pointbox{background:white;border:3px solid #d6edf7;border-radius:18px;padding:8px 12px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.08)}
.pointbox .label{font-size:14px;font-weight:800;color:#577}
.pointbox .num{font-size:30px;font-weight:900;color:#e06b00}
.nav{margin:12px 0}
.nav a{display:inline-block;text-decoration:none;font-weight:900;border-radius:14px;padding:8px 12px;margin-right:6px}
.menu{background:white;color:#164f89;border:2px solid #b9dfea}
.prev{background:#eef4f7;color:#456;border:2px solid #cbdde6}
.main{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}
.panel{background:rgba(255,255,255,.97);border:4px solid #dff0f8;border-radius:26px;padding:18px;box-shadow:0 10px 24px rgba(35,94,130,.14)}
.stage{display:inline-block;background:#9b5a2b;color:white;padding:7px 15px;border-radius:12px;font-size:21px;font-weight:900;box-shadow:inset 0 -4px rgba(0,0,0,.12)}
.progress{margin:12px 0;font-weight:900;color:#456}
.sentenceCard{background:#fafdff;border:4px dashed #8ed2ee;border-radius:22px;padding:18px}
.chunkRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:15px 0}
.chunk{
 background:#fffbe7;border:3px solid #f4d977;border-radius:16px;padding:12px 18px;
 font-size:clamp(30px,5vw,54px);font-weight:900;cursor:pointer;box-shadow:0 4px 0 #ead27a
}
.chunk:active{transform:scale(.98)}
.bar{height:8px;background:#dbeef5;border-radius:999px;overflow:hidden;margin:10px 0}
.bar>div{height:100%;background:#67c56d;width:0;transition:.3s}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit;border:0;border-radius:16px;padding:11px 15px;font-weight:900;cursor:pointer}
.listen{background:#1675c3;color:white;box-shadow:0 5px 0 #0d4e84}
.slow{background:#eef6fa;border:2px solid #cfe0e8}
.help{margin-top:12px;background:#fff3f6;border:3px solid #f4bfd0;border-radius:18px;padding:11px;font-weight:800}
.qtitle{background:#e84545;color:white;text-align:center;border-radius:16px;padding:9px;font-size:24px;font-weight:900;box-shadow:0 5px 0 #b72e2e}
.question{font-size:clamp(23px,3vw,32px);font-weight:900;background:#fff9db;border:3px dashed #f1ca58;border-radius:18px;padding:12px;margin:13px 0}
.answers{display:grid;gap:10px}
.answer{background:white;border:3px solid #e2e6ea;border-radius:18px;min-height:70px;padding:10px 14px;font-size:clamp(21px,2.8vw,29px);text-align:left}
.answer.correct{border-color:#62c56f;background:#effbea}
.answer.wrong{border-color:#ef7777;background:#fff1f1}
.feedback{min-height:80px;margin-top:12px;border-radius:18px;background:#f5f8fb;padding:12px 14px;font-size:19px;font-weight:900}
.feedback.ok{background:#edfae9;color:#2a7636}.feedback.ng{background:#fff0f0;color:#a33333}
.next{width:100%;margin-top:12px;background:#8e66d9;color:#fff;font-size:21px;box-shadow:0 5px 0 #6545a5}
.charZone{margin-top:13px;min-height:145px;border-radius:22px;background:linear-gradient(#dff7ff,#fff8ce);border:3px solid #bfe4f3;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.charZone .msg{position:absolute;left:12px;top:10px;background:#fff;border-radius:14px;padding:8px 12px;font-weight:900}
.char{width:150px;height:125px;animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.2) rotate(-10deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.bonus{position:absolute;right:15px;bottom:8px;font-size:28px;font-weight:900;color:#e06b00;animation:float 1.2s ease forwards}
@keyframes float{0%{transform:translateY(20px);opacity:0}40%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
.adultWrap{text-align:right;margin-top:8px}
.adultBtn{background:#eef4f7;color:#4a5d69;border:2px solid #c9d8df;border-radius:14px;padding:7px 11px;font-size:13px}
.adultPanel{display:none;margin-top:8px;background:white;border:2px solid #d5e1e6;border-radius:14px;padding:10px;text-align:left}
.resetBtn{width:100%;background:#fff0f0;color:#a93535;border:2px solid #e6aaaa}
@media(max-width:820px){header{grid-template-columns:1fr}.points{min-width:0}.main{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="logo">
  <h1>📘 よんで わかる！ 第2巻</h1>
  <div class="sub">STEP 2　ことばの かたまりで よもう</div>
 </div>
 <div>
  <div class="points">
   <div class="pointbox"><div class="label">きょう ゲット</div><div class="num"><span id="todayPts">0</span> pt</div></div>
   <div class="pointbox"><div class="label">るいせき</div><div class="num"><span id="totalPts">0</span> pt</div></div>
  </div>
  <div class="adultWrap">
   <button id="adultBtn" class="adultBtn">⚙️ おとな用（3びょう ながおし）</button>
   <div id="adultPanel" class="adultPanel">
    <button id="resetPts" class="resetBtn">ポイントを 0 に もどす</button>
   </div>
  </div>
 </div>
</header>

<div class="nav">
 <a class="menu" href="index.html">🏠 第2巻メニュー</a>
 <a class="prev" href="step1.html">◀ STEP 1</a>
</div>

<div class="main">
<section class="panel">
 <div class="stage">🧩 かたまりで よんでみよう！</div>
 <div class="progress">もんだい <span id="num">1</span> / <span id="total">10</span></div>

 <div class="sentenceCard">
   <div id="chunkRow" class="chunkRow"></div>
   <div class="bar"><div id="barFill"></div></div>
   <div class="controls">
    <button id="readAll" class="listen">🔊 ぜんぶ きく</button>
    <button id="readSlow" class="slow">🐢 ゆっくり きく</button>
   </div>
   <div class="help">💡 ことばを ひとつずつ ではなく、<b>かたまり</b>で よんでみよう。かたまりを おすと、その ぶぶんだけ きけるよ。</div>
 </div>

 <div id="charZone" class="charZone">
  <div class="msg">せいかいすると +10ポイント！</div>
  <div id="character"></div>
 </div>
</section>

<section class="panel">
 <div class="qtitle">❓ ぶんの いみを えらぼう！</div>
 <div id="question" class="question"></div>
 <div id="answers" class="answers"></div>
 <div id="feedback" class="feedback">かたまりで よんで、いみを かんがえよう。</div>
 <button id="next" class="next" disabled>つぎへ ▶</button>
</section>
</div>
</div>

<script>
const items=[
 {chunks:["ねこが","はしっています。"],say:["ねこ が","はしっています"],q:"はしっているのは だれ？",choices:["ねこ","いぬ","とり"],ans:0},
 {chunks:["いぬが","みずを のみます。"],say:["いぬ が","みずを のみます"],q:"いぬは なにを のむ？",choices:["みず","りんご","えんぴつ"],ans:0},
 {chunks:["あかい りんごを","ひとつ たべます。"],say:["あかい りんごを","ひとつ たべます"],q:"たべるのは なに？",choices:["りんご","ほん","かさ"],ans:0},
 {chunks:["おひさまが","でました。"],say:["おひさま が","でました"],q:"でてきたのは なに？",choices:["おひさま","つき","くるま"],ans:0},
 {chunks:["ほんを","よみます。"],say:["ほんを","よみます"],q:"なにを よむ？",choices:["ほん","みず","はな"],ans:0},
 {chunks:["えんぴつで","じを かきます。"],say:["えんぴつ で","じを かきます"],q:"なにで じを かく？",choices:["えんぴつ","くつ","さら"],ans:0},
 {chunks:["こうえんで","あそびます。"],say:["こうえん で","あそびます"],q:"どこで あそぶ？",choices:["こうえん","びょういん","おふろ"],ans:0},
 {chunks:["かさを もって","そとへ いきます。"],say:["かさを もって","そと え いきます"],q:"もっていくのは なに？",choices:["かさ","おむすび","くつした"],ans:0},
 {chunks:["はなを","みつけました。"],say:["はなを","みつけました"],q:"みつけたのは なに？",choices:["はな","でんしゃ","つくえ"],ans:0},
 {chunks:["くるまが","とまりました。"],say:["くるま が","とまりました"],q:"とまったのは なに？",choices:["くるま","うさぎ","たいよう"],ans:0}
];

const chars=[
`<svg class="char" viewBox="0 0 150 125"><g fill="#68c35b" stroke="#2e7338" stroke-width="4"><ellipse cx="75" cy="78" rx="45" ry="35"/><circle cx="58" cy="48" r="22"/><circle cx="92" cy="48" r="22"/><path d="M44 31l-7-18 16 10M106 31l7-18-16 10"/></g><circle cx="56" cy="48" r="4"/><circle cx="94" cy="48" r="4"/><path d="M57 68q18 16 36 0" fill="none" stroke="#244" stroke-width="4"/></svg>`,
`<svg class="char" viewBox="0 0 150 125"><rect x="40" y="34" width="70" height="65" rx="18" fill="#61bde8" stroke="#245f81" stroke-width="4"/><circle cx="61" cy="61" r="7" fill="#173a55"/><circle cx="89" cy="61" r="7" fill="#173a55"/><path d="M59 82h32" stroke="#173a55" stroke-width="5"/><path d="M75 34V18M67 18h16" stroke="#245f81" stroke-width="5"/></svg>`,
`<svg class="char" viewBox="0 0 150 125"><path d="M30 96q14-61 45-66q39 1 47 66z" fill="#f28c35" stroke="#a9561e" stroke-width="4"/><circle cx="60" cy="64" r="7"/><circle cx="90" cy="64" r="7"/><path d="M58 82q17 12 34 0" fill="none" stroke="#6f3718" stroke-width="4"/><path d="M43 35l8-24 14 18M107 35l-8-24-14 18" fill="#ffd65c"/></svg>`,
`<svg class="char" viewBox="0 0 150 125"><circle cx="75" cy="53" r="30" fill="#ffd1a8"/><path d="M45 45q7-32 30-33q27 0 34 33q-17-14-33-8q-17 5-31 8" fill="#262626"/><circle cx="62" cy="56" r="4"/><circle cx="88" cy="56" r="4"/><path d="M58 72q17 12 34 0" fill="none" stroke="#923c34" stroke-width="4"/><rect x="50" y="84" width="50" height="30" rx="10" fill="#ffcc42"/></svg>`
];

let idx=0,answered=false,readChunks=new Set();
const $=id=>document.getElementById(id);
$("total").textContent=items.length;

function dateKey(){
 const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const TODAY_KEY="yomide_v2_today_"+dateKey(),TOTAL_KEY="yomide_v2_total";
const getPts=k=>Number(localStorage.getItem(k)||0);
function refreshPts(){ $("todayPts").textContent=getPts(TODAY_KEY);$("totalPts").textContent=getPts(TOTAL_KEY);}
function addPts(n){localStorage.setItem(TODAY_KEY,getPts(TODAY_KEY)+n);localStorage.setItem(TOTAL_KEY,getPts(TOTAL_KEY)+n);refreshPts();}

function speak(t,rate=.9){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=rate;u.pitch=1;speechSynthesis.speak(u);}
function updateBar(){ $("barFill").style.width=((readChunks.size/items[idx].chunks.length)*100)+"%";}

function render(){
 answered=false;readChunks=new Set();updateBar();
 const x=items[idx];$("num").textContent=idx+1;
 $("chunkRow").innerHTML="";
 x.chunks.forEach((c,i)=>{
   const b=document.createElement("button");b.className="chunk";b.textContent=c;
   b.onclick=()=>{readChunks.add(i);updateBar();speak(x.say[i],.84)};
   $("chunkRow").appendChild(b);
 });
 $("question").textContent=x.q;
 $("answers").innerHTML="";
 const order=[0,1,2].sort(()=>Math.random()-.5);
 order.forEach(i=>{
   const b=document.createElement("button");b.className="answer";b.textContent=x.choices[i];
   b.onclick=()=>check(i,b);$("answers").appendChild(b);
 });
 $("feedback").className="feedback";$("feedback").textContent="かたまりで よんで、いみを かんがえよう。";
 $("next").disabled=true;
 $("next").textContent=idx===items.length-1?"10もん できた！ ▶":"つぎへ ▶";
}
function showChar(){
 $("character").innerHTML=chars[Math.floor(Math.random()*chars.length)];
 const d=document.createElement("div");d.className="bonus";d.textContent="+10 pt!";
 $("charZone").appendChild(d);setTimeout(()=>d.remove(),1200);
}
function check(i,b){
 if(answered)return;
 const x=items[idx];
 if(i===x.ans){
  answered=true;b.classList.add("correct");addPts(10);showChar();
  $("feedback").className="feedback ok";$("feedback").textContent="🎉 せいかい！ ぶんの いみが わかったね。10ポイント ゲット！";
  speak("せいかい！ じゅっポイント ゲット！");$("next").disabled=false;
 }else{
  b.classList.add("wrong");$("feedback").className="feedback ng";$("feedback").textContent="おしい！ もういちど ぶんを みてみよう。";
  speak("おしい！ もういちど");setTimeout(()=>b.classList.remove("wrong"),700);
 }
}
$("readAll").onclick=()=>speak(items[idx].say.join(" "),.9);
$("readSlow").onclick=()=>speak(items[idx].say.join(" "),.65);
$("next").onclick=()=>{
 speechSynthesis.cancel();
 if(idx<items.length-1){idx++;render();}
 else{
  idx=0;render();$("feedback").className="feedback ok";
  $("feedback").textContent="🎊 STEP 2 クリア！ もういちど やると、また ポイントが もらえるよ！";
  speak("ステップツー クリア！ よくできました！");
 }
};

let adultTimer=null;
$("adultBtn").addEventListener("pointerdown",()=>adultTimer=setTimeout(()=>{$("adultPanel").style.display=$("adultPanel").style.display==="block"?"none":"block";adultTimer=null},3000));
["pointerup","pointerleave","pointercancel"].forEach(ev=>$("adultBtn").addEventListener(ev,()=>{if(adultTimer){clearTimeout(adultTimer);adultTimer=null}}));
$("resetPts").onclick=()=>{
 if(confirm("きょうのポイント と るいせきポイントを 0 に もどします。よろしいですか？")){
  localStorage.setItem(TODAY_KEY,0);localStorage.setItem(TOTAL_KEY,0);refreshPts();$("adultPanel").style.display="none";
 }
};

refreshPts();render();
</script>
</body></html>
